# The vendored faces. Nothing is resolved from the system: a system font makes
# output machine-dependent, and evidence that renders differently on another
# laptop is not evidence.
#
# `grimstroke doctor` checks each sha256 against this file.

[face.Estedad]
files = ["Estedad-Regular.ttf", "Estedad-Bold.ttf"]
scripts = ["arabic", "latin"]
licence = "SIL OFL 1.1"
licence_file = "OFL-Estedad.txt"
source = "https://github.com/aminabedi68/Estedad"
note = "The Persian face. Covers Arabic script and a Persian-optimised Latin."

[face."JetBrains Mono"]
files = ["JetBrainsMono-Regular.ttf", "JetBrainsMono-Bold.ttf"]
scripts = ["latin", "greek", "cyrillic"]
licence = "SIL OFL 1.1"
licence_file = "OFL-JetBrainsMono.txt"
source = "https://github.com/JetBrains/JetBrainsMono/releases/tag/v2.304"
version = "2.304"
note = "Latin body and all technical strings. The design language is monospace-forward, so this IS the Latin body face, not just a code face."

